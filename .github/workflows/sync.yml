name: IG Sync

on:
  schedule:
    # 4x ao dia, horários em UTC. A última (02:50 UTC) é 23:50 de Brasília:
    # é ela que fecha o dia na aba de impulsionamentos, e o código carimba a
    # linha com a data BRT, não a UTC — sem isso o "fechamento" cairia às 21h
    # e todo dia perderia as últimas 3 horas.
    #   09:00 UTC = 06:00 BRT   |   15:00 UTC = 12:00 BRT
    #   21:00 UTC = 18:00 BRT   |   02:50 UTC = 23:50 BRT (fechamento)
    - cron: '50 2,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        required: false
        default: 'false'
      only:
        description: 'Sync only one account (metta|tiago). Empty = both.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run sync
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          METTA_INSTAGRAM_USER_ID: ${{ secrets.METTA_INSTAGRAM_USER_ID }}
          TIAGO_INSTAGRAM_USER_ID: ${{ secrets.TIAGO_INSTAGRAM_USER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_ADS_ACCESS_TOKEN: ${{ secrets.META_ADS_ACCESS_TOKEN }}
          IG_SESSIONID_TIAGO: ${{ secrets.IG_SESSIONID_TIAGO }}
          IG_SESSIONID_METTA: ${{ secrets.IG_SESSIONID_METTA }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SYNC_ONLY: ${{ inputs.only || '' }}
        run: python -m src.main
