name: IG Sync

on:
  schedule:
    - cron: '0 * * * *'   # toda hora
  workflow_dispatch:
    inputs:
      dry_run:
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run sync
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          METTA_INSTAGRAM_USER_ID: ${{ secrets.METTA_INSTAGRAM_USER_ID }}
          TIAGO_INSTAGRAM_USER_ID: ${{ secrets.TIAGO_INSTAGRAM_USER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python -m src.main
